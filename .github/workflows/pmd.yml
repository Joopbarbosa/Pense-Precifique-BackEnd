name: PMD baseline
on:
  pull_request:
  push:
    branches: [staging]

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: python3 scripts/run_pmd_gate.py
