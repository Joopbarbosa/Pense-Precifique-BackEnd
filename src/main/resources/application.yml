# ============================================================
# application.yml — base (todos os ambientes herdam)
# ============================================================
spring:
  application:
    name: pense-precifique-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

pdf:
  microservice:
    # Nome do serviço no docker-compose raiz (rede interna Docker) — trocar via env var quando o
    # deploy em produção (VPS) tiver a URL real do microsserviço.
    base-url: ${PDF_MICROSERVICE_BASE_URL:http://pense-precifique-pdf:3001}
    timeout-seconds: ${PDF_MICROSERVICE_TIMEOUT_SECONDS:30}

---
# ============================================================
# application-dev.yml — desenvolvimento local
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.penseprecifique: DEBUG
    org.springframework.security: DEBUG

---
# ============================================================
# application-prod.yml — produção (VPS)
# ============================================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

springdoc:
  swagger-ui:
    enabled: false   # desabilita swagger em produção

logging:
  level:
    com.penseprecifique: INFO
    org.springframework: WARN
