# ============================================================
# application.yml — base (todos os ambientes herdam)
# ============================================================
spring:
  application:
    name: pense-precifique-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # RN-NOVA-6 permite até 5MB — teto do framework bem acima disso (nunca os mesmos 5MB) para
      # que a rejeição de arquivo grande sempre aconteça na validação do Service (mensagem
      # específica de RN-NOVA-6/CEN-NOVO-6), nunca como MaxUploadSizeExceededException genérica.
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

pdf:
  microservice:
    # Nome do serviço no docker-compose raiz (rede interna Docker) — trocar via env var quando o
    # deploy em produção (VPS) tiver a URL real do microsserviço.
    base-url: ${PDF_MICROSERVICE_BASE_URL:http://pense-precifique-pdf:3001}
    timeout-seconds: ${PDF_MICROSERVICE_TIMEOUT_SECONDS:30}

# V0.16.0 (#683, DT-NOVA-9) — serviço leitor-fiscal, na rede Docker compartilhada. A chave do produto e o
# segredo da assinatura da leitura vêm de variável de ambiente; vazios = recurso de nota indisponível.
leitor-fiscal:
  base-url: ${LEITOR_FISCAL_BASE_URL:http://leitor-fiscal:3000}
  chave-produto: ${LEITOR_FISCAL_CHAVE:}
  timeout-seconds: ${LEITOR_FISCAL_TIMEOUT_SECONDS:70}

nota:
  assinatura:
    segredo: ${NOTA_ASSINATURA_SEGREDO:}
    validade-minutos: ${NOTA_ASSINATURA_VALIDADE_MINUTOS:120}

# V0.16.0 (#681, DT-NOVA-11) — sugestão de insumo por IA na conciliação da nota (provedor compatível com
# OpenAI). Desligada por padrão até a política de privacidade (#675). Limite técnico por conta e mês,
# fora do limite de leituras do leitor-fiscal.
sugestao-ia:
  habilitada: ${SUGESTAO_IA_HABILITADA:false}
  base-url: ${SUGESTAO_IA_BASE_URL:}
  chave: ${SUGESTAO_IA_CHAVE:}
  modelo: ${SUGESTAO_IA_MODELO:}
  timeout-seconds: ${SUGESTAO_IA_TIMEOUT_SECONDS:20}
  limite-mensal-por-conta: ${SUGESTAO_IA_LIMITE_MENSAL_POR_CONTA:200}

# Cloudflare R2 (compatível S3) — upload de foto do Item de Catálogo, DT-NOVA-4. Credenciais no
# .env da raiz do projeto, nunca hardcoded.
r2:
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  endpoint: ${R2_ENDPOINT}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL}

---
# ============================================================
# application-dev.yml — desenvolvimento local
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.penseprecifique: DEBUG
    org.springframework.security: DEBUG

---
# ============================================================
# application-prod.yml — produção (VPS)
# ============================================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

springdoc:
  swagger-ui:
    enabled: false   # desabilita swagger em produção

logging:
  level:
    com.penseprecifique: INFO
    org.springframework: WARN
