# #756 (V0.16.0) — risco aceito e contido, com prazo. Sem este arquivo o OSV-Scanner volta a reportar o achado.
# org.springframework:spring-webmvc 6.2.19 (GHSA-pc63-qcmh-9cmg, CRITICAL, CVE-2026-47884): SSRF/RCE por XsltView
# com mapeamento "/**" que renderiza view sem nome explícito. A linha 6.x não tem versão corrigida; a correção só
# existe no Spring Framework 7.0.9 (Spring Boot 4), migração grande que não cabe nesta versão.
# Contenção: a API só devolve JSON (@RestController), sem view resolver, sem XsltView e sem Thymeleaf (removido na
# V0.8.1). O teste `SemViewXsltTest` falha se um @Controller com view ou XsltView aparecer no código.
# Revisar quando sair 6.2.x corrigida ou ao migrar para Spring Boot 4, o que vier primeiro, e no máximo até a data abaixo.
[[IgnoredVulns]]
id = "GHSA-pc63-qcmh-9cmg"
ignoreUntil = 2027-01-31
reason = "Sem XsltView nem view resolver (API só JSON); sem versão 6.2 corrigida; teste SemViewXsltTest trava a regressão. Sair com o Spring Boot 4."
